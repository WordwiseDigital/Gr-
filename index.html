<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrikaans Ruimte Avontuur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Afrikaans Ruimte Avontuur</h1>
        </header>
        <main id="main-menu">
            <h2>Kies 'n Planeet om te Verken!</h2>
            <div id="galaxy-map">
                <div class="planet" id="meervoude-planet">
                    <span>Meervoude</span>
                </div>
                <div class="planet" id="verlede-tyd-planet">
                    <span>Verlede Tyd</span>
                </div>
                <div class="planet" id="alfabet-planet">
                    <span>Alfabetiese Volgorde</span>
                </div>
                <div class="planet" id="voegwoorde-planet">
                    <span>Voegwoorde</span>
                </div>
            </div>
        </main>
        <div id="game-view" class="hidden">
            <!-- Game modules will be loaded here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
